name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定到已在本地验证过的版本，避免 latest 改变 lockfile 或测试行为。
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 统一 node 22（windows runner 镜像自带 22）：避免 npm ci 装 better-sqlite3
          # prebuilt（node24 ABI 137）与运行时 node（22 ABI 127）不匹配
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install server test dependencies
        run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./apps/electron/package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version v$tagVersion does not match apps/electron/package.json version $packageVersion"
          }
          "Releasing verified version: $packageVersion"

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Run unit and regression tests
        # --isolate: bun 的 mock.module('electron') 是进程级注册表，默认并行下多文件互相覆盖导致误报；隔离模式保证每个测试文件独立
        run: bun test --isolate --timeout 30000

      - name: Run Node.js server reliability gate
        # 直接调用真实 Node（node 22，ABI 127）运行 node:test，避免 bun 加载
        # better-sqlite3 prebuilt（ABI 137）不匹配；收集规则 *.node.test.mjs。
        run: node scripts/run-node-tests.mjs
        working-directory: server
      - name: Build GitHub app
        run: bun run electron:build:github
        working-directory: .

      # Pi runtime is external to the main-process bundle; copy its dependency closure into appDir before electron-builder.
      - name: Sync external Agent runtime dependencies
        run: bun run sync:runtime-deps
        working-directory: apps/electron
      - name: Package Windows release
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/electron

      - name: Smoke test unpacked Windows app
        shell: pwsh
        working-directory: apps/electron
        run: |
          $appPath = Join-Path $PWD "out/win-unpacked/Profer.exe"
          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "Missing unpacked application: $appPath"
          }

          $process = Start-Process -FilePath $appPath -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              throw "Packaged application exited during smoke test with code $($process.ExitCode)"
            }
            throw "Packaged application exited before the smoke-test window completed"
          }

          # 长驻 Electron 进程存活至观察窗口即视为通过；清理时的强制终止退出码不代表启动失败。
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

      - name: Probe packaged Pi runtime closure
        shell: pwsh
        working-directory: apps/electron
        run: |
          $probePath = Join-Path $PWD "scripts/packaged-pi-probe.cjs"
          if (-not (Test-Path -LiteralPath $probePath)) {
            throw "Missing Pi probe script: $probePath"
          }
          $unpackedResources = Join-Path $PWD "out/win-unpacked/resources"
          if (-not (Test-Path -LiteralPath $unpackedResources)) {
            throw "Missing unpacked resources for Pi probe: $unpackedResources"
          }
          $env:ELECTRON_RUN_AS_NODE = "1"
          # Profer.exe 是 GUI 子系统程序，pwsh 的 `&` 调用不会等待其退出，
          # 必须用 Start-Process -Wait -PassThru 同步等待并捕获退出码。
          # 外层 Wait-Process -Timeout 防止 native/WASM 初始化挂死时 job 无限卡到 6h。
          $stdout = Join-Path $PWD "probe-out.txt"
          $stderr = Join-Path $PWD "probe-err.txt"
          $process = Start-Process -FilePath (Join-Path $PWD "out/win-unpacked/Profer.exe") `
            -ArgumentList @($probePath, $unpackedResources) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Host "--- probe stderr (timeout) ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Pi runtime closure probe timed out after 120s"
          }
          $exitCode = $process.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "--- probe stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- probe stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Pi runtime closure probe failed with exit code $exitCode"
          }
          Write-Host "Pi runtime closure verified"
          if (Test-Path $stdout) { Get-Content $stdout }

      - name: Collect Windows release assets
        shell: pwsh
        working-directory: apps/electron
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $required = @(
            "latest.yml"
            "Profer-Setup-$version.exe"
            "Profer-Setup-$version.exe.blockmap"
          )

          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          foreach ($name in $required) {
            $source = Join-Path "out" $name
            if (-not (Test-Path -LiteralPath $source)) {
              Write-Host "Files in apps/electron/out:"
              Get-ChildItem -Path "out" -Recurse | Select-Object FullName, Length
              throw "Missing required Windows release asset: $name"
            }
            Copy-Item -LiteralPath $source -Destination "release-assets/$name" -Force
          }

      - name: Remove stale release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: apps/electron
        run: |
          gh release delete "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag=false 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing release to delete for $env:GITHUB_REF_NAME"
            exit 0
          }

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Profer ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            apps/electron/release-assets/latest.yml
            apps/electron/release-assets/*.exe
            apps/electron/release-assets/*.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
