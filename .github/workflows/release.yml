name: Windows Release Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要验证的分支、tag 或 commit SHA'
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 固定到已在本地验证过的版本，避免 latest 改变 lockfile 或测试行为。
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 统一 node 22（windows runner 镜像自带 22）：避免 npm ci 装 better-sqlite3
          # prebuilt（node24 ABI 137）与运行时 node（22 ABI 127）不匹配
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify app version and tag consistency
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./apps/electron/package.json').version"
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid apps/electron/package.json version: $packageVersion"
          }
          $requestedRef = "${{ inputs.ref }}"
          if ($requestedRef -match '^v') {
            $tagVersion = $requestedRef -replace '^v', ''
            if ($tagVersion -ne $packageVersion) {
              throw "Tag version $requestedRef does not match apps/electron/package.json version $packageVersion"
            }
          }
          "Verifying version: $packageVersion"

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Verify built-in skin surface contract
        run: bun --cwd apps/electron run check:skin-contract

      - name: Run unit and regression tests
        # --isolate: bun 的 mock.module('electron') 是进程级注册表，默认并行下多文件互相覆盖导致误报；隔离模式保证每个测试文件独立
        run: bun test --isolate --timeout 30000

      - name: Build GitHub app
        run: bun run electron:build:github
        working-directory: .

      # Pi runtime is external to the main-process bundle; copy its dependency closure into appDir before electron-builder.
      - name: Sync external Agent runtime dependencies
        run: bun run sync:runtime-deps
        working-directory: apps/electron
      - name: Verify Windows signing secrets
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw '缺少 WIN_CSC_LINK 或 WIN_CSC_KEY_PASSWORD；禁止构建未签名 Windows 发布包。'
          }

      - name: Package Windows release
        run: node scripts/run-electron-builder.cjs --win --x64 --publish never
        working-directory: apps/electron
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Smoke test unpacked Windows app
        shell: pwsh
        working-directory: apps/electron
        run: |
          $appPath = Join-Path $PWD "out/win-unpacked/Profer.exe"
          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "Missing unpacked application: $appPath"
          }

          $process = Start-Process -FilePath $appPath -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) {
              throw "Packaged application exited during smoke test with code $($process.ExitCode)"
            }
            throw "Packaged application exited before the smoke-test window completed"
          }

          # 长驻 Electron 进程存活至观察窗口即视为通过；清理时的强制终止退出码不代表启动失败。
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

      - name: Probe packaged Pi runtime closure
        shell: pwsh
        working-directory: apps/electron
        run: |
          $probePath = Join-Path $PWD "scripts/packaged-pi-probe.cjs"
          if (-not (Test-Path -LiteralPath $probePath)) {
            throw "Missing Pi probe script: $probePath"
          }
          $unpackedResources = Join-Path $PWD "out/win-unpacked/resources"
          if (-not (Test-Path -LiteralPath $unpackedResources)) {
            throw "Missing unpacked resources for Pi probe: $unpackedResources"
          }
          $env:ELECTRON_RUN_AS_NODE = "1"
          # Profer.exe 是 GUI 子系统程序，pwsh 的 `&` 调用不会等待其退出，
          # 必须用 Start-Process -Wait -PassThru 同步等待并捕获退出码。
          # 外层 Wait-Process -Timeout 防止 native/WASM 初始化挂死时 job 无限卡到 6h。
          $stdout = Join-Path $PWD "probe-out.txt"
          $stderr = Join-Path $PWD "probe-err.txt"
          $process = Start-Process -FilePath (Join-Path $PWD "out/win-unpacked/Profer.exe") `
            -ArgumentList @($probePath, $unpackedResources) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $process.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Host "--- probe stderr (timeout) ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Pi runtime closure probe timed out after 120s"
          }
          $exitCode = $process.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "--- probe stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- probe stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Pi runtime closure probe failed with exit code $exitCode"
          }
          Write-Host "Pi runtime closure verified"
          if (Test-Path $stdout) { Get-Content $stdout }

      - name: Sign update metadata
        shell: pwsh
        working-directory: apps/electron
        env:
          PROFER_UPDATE_METADATA_PRIVATE_KEY: ${{ secrets.PROFER_UPDATE_METADATA_PRIVATE_KEY }}
        run: bun run sign:update-metadata

      - name: Verify Authenticode and update metadata
        shell: pwsh
        working-directory: apps/electron
        env:
          PROFER_UPDATE_METADATA_PUBLIC_KEY: ${{ secrets.PROFER_UPDATE_METADATA_PUBLIC_KEY }}
        run: bun run verify:release-assets

      - name: Verify Windows release assets
        shell: pwsh
        working-directory: apps/electron
        run: |
          $version = node -p "require('./package.json').version"
          $required = @(
            "latest.yml",
            "latest.yml.sig",
            "Profer-Setup-$version.exe",
            "Profer-Setup-$version.exe.blockmap"
          )

          foreach ($name in $required) {
            $source = Join-Path "out" $name
            if (-not (Test-Path -LiteralPath $source)) {
              Write-Host "Files in apps/electron/out:"
              Get-ChildItem -Path "out" -Recurse | Select-Object FullName, Length
              throw "Missing required Windows release asset: $name"
            }
            "$name verified"
          }
