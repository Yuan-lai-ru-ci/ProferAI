<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profer — round 3 icon refinement</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--muted:#999;--paper:#f2f1ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:48px 28px 72px}header{margin-bottom:32px}h1{font-size:34px;letter-spacing:-.05em;margin:0}header p{margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid #303030;border-radius:24px;padding:18px}.card h2{font-size:18px;margin:0}.desc{color:var(--muted);min-height:48px;margin:7px 0 16px;font-size:13px}.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:16px;min-height:280px;display:grid;place-items:center}.tile img{width:86%;height:86%}.dark{background:#050505}.light{background:var(--paper)}.sizes{display:flex;align-items:end;gap:20px;margin-top:16px;padding:12px 14px;background:#151515;border-radius:14px}.sizes div{display:grid;gap:6px;justify-items:center;color:#999;font-size:11px}.sizes img{display:block}.s64{width:64px;height:64px}.s32{width:32px;height:32px}.s16{width:16px;height:16px}.brief{margin-top:22px;padding:18px 20px;background:#181818;border-left:3px solid #888;color:#c7c7c7}.brief strong{color:#fff}.swatches{display:flex;gap:8px;margin-top:14px}.swatches span{height:4px;flex:1;background:#151515}.swatches span:nth-child(2){background:#777}.swatches span:nth-child(3){background:#f2f1ed}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>Profer / icon refinement · round 3</h1><p>少解释、少层次、只保留一个优雅的开放轮廓</p></header>
<section class="grid">
<article class="card"><h2>01 / 开放轨道</h2><p class="desc">最接近完整环，但通过右上方缺口形成“开放入口”。比例均衡，识别最稳。</p><div class="stage"><div class="tile dark"><img src="concept-open-orbit.svg" alt="开放轨道黑底预览"></div><div class="tile light"><img src="concept-open-orbit.svg" alt="开放轨道白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-open-orbit.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-open-orbit.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-open-orbit.svg" alt=""><span>16</span></div></div></article>
<article class="card"><h2>02 / 柔和切口</h2><p class="desc">更紧凑、更柔软，开口更像一个偏心的呼吸面，不追求完整圆环。</p><div class="stage"><div class="tile dark"><img src="concept-soft-aperture.svg" alt="柔和切口黑底预览"></div><div class="tile light"><img src="concept-soft-aperture.svg" alt="柔和切口白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-soft-aperture.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-soft-aperture.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-soft-aperture.svg" alt=""><span>16</span></div></div></article>
<article class="card"><h2>03 / 上升环</h2><p class="desc">底部更稳，右上端点更有方向性，强调智能响应和向前生长。</p><div class="stage"><div class="tile dark"><img src="concept-rising-loop.svg" alt="上升环黑底预览"></div><div class="tile light"><img src="concept-rising-loop.svg" alt="上升环白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-rising-loop.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-rising-loop.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-rising-loop.svg" alt=""><span>16</span></div></div></article>
</section><div class="brief"><strong>这一轮只评轮廓：</strong>全部为纯黑单色，不使用灰色投影、不使用多层缠绕。请优先看 32px 和 16px：哪个形状缩小后最像一个独立品牌符号，而不是字母或 UI 图标。</div><div class="swatches"><span></span><span></span><span></span></div>
</main></body></html>
