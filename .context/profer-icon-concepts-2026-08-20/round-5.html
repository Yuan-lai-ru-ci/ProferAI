<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profer — round 5 icon studies</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--muted:#999;--paper:#f2f1ed;--ink:#151515}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:48px 28px 72px}header{margin-bottom:32px}h1{font-size:34px;letter-spacing:-.05em;margin:0}header p{margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--panel);border:1px solid #303030;border-radius:24px;padding:18px}.card h2{font-size:18px;margin:0}.desc{color:var(--muted);min-height:48px;margin:7px 0 16px;font-size:13px}.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:16px;min-height:300px;display:grid;place-items:center}.tile img{width:88%;height:88%}.dark{background:#050505}.dark img{filter:invert(1)}.light{background:var(--paper)}.sizes{display:flex;align-items:end;justify-content:space-around;margin-top:16px;padding:12px 8px;background:#151515;border-radius:14px}.sizes div{display:grid;gap:6px;justify-items:center;color:#999;font-size:11px}.sizes img{display:block;filter:invert(1)}.s64{width:56px;height:56px}.s32{width:32px;height:32px}.s16{width:16px;height:16px}.brief{margin-top:22px;padding:18px 20px;background:#181818;border-left:3px solid #888;color:#c7c7c7}.brief strong{color:#fff}.swatches{display:flex;gap:6px;margin-top:14px}.swatches i{height:4px;flex:1;background:#151515}.swatches i:nth-child(2){background:#777}.swatches i:nth-child(3){background:#f2f1ed}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>Profer / icon studies · round 5</h1><p>把“图形意义”拿掉，只留下柔和、上升、连续的品牌节奏</p></header>
<section class="grid">
<article class="card"><h2>01 / 柔和流</h2><p class="desc">四条宽厚曲线共享一个低重心，像连续的信号流，不形成具体物件。</p><div class="stage"><div class="tile dark"><img src="concept-soft-current.svg" alt="柔和流黑底预览"></div><div class="tile light"><img src="concept-soft-current.svg" alt="柔和流白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-soft-current.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-soft-current.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-soft-current.svg" alt=""><span>16</span></div></div></article>
<article class="card"><h2>02 / 波峰</h2><p class="desc">单一宽曲面向右上抬升，边缘形成自然节奏，避免条形图和月牙联想。</p><div class="stage"><div class="tile dark"><img src="concept-wave-crest.svg" alt="波峰黑底预览"></div><div class="tile light"><img src="concept-wave-crest.svg" alt="波峰白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-wave-crest.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-wave-crest.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-wave-crest.svg" alt=""><span>16</span></div></div></article>
<article class="card"><h2>03 / 丝带火花</h2><p class="desc">三条有方向的柔性丝带从低处展开，存在动势，但不使用尖锐闪电。</p><div class="stage"><div class="tile dark"><img src="concept-ribbon-spark.svg" alt="丝带火花黑底预览"></div><div class="tile light"><img src="concept-ribbon-spark.svg" alt="丝带火花白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-ribbon-spark.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-ribbon-spark.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-ribbon-spark.svg" alt=""><span>16</span></div></div></article>
</section><div class="brief"><strong>本轮先看一个问题：</strong>哪个方案在不解释、不加字、不靠渐变的情况下，也能成为 Profer 独有的符号？黑底预览已反转为白色，确保能直接比较实际使用的正反版本。</div><div class="swatches"><i></i><i></i><i></i></div>
</main></body></html>
