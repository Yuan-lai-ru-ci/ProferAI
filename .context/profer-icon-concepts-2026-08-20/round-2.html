<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profer — round 2 icon studies</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--muted:#9a9a9a;--paper:#f2f1ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f4;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1060px;margin:auto;padding:48px 28px 72px}header{margin-bottom:34px}h1{font-size:34px;letter-spacing:-.05em;margin:0}header p{margin:8px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:var(--panel);border:1px solid #303030;border-radius:24px;padding:20px}.card h2{font-size:20px;margin:0}.desc{color:var(--muted);min-height:48px;margin:7px 0 18px;font-size:13px}.stage{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border-radius:18px;min-height:350px;display:grid;place-items:center}.tile img{width:88%;height:88%}.dark{background:#050505}.light{background:var(--paper)}.sizes{display:flex;align-items:end;gap:22px;margin-top:18px;padding:14px 16px;background:#151515;border-radius:16px}.sizes div{display:grid;gap:6px;justify-items:center;color:#999;font-size:11px}.sizes img{display:block}.s64{width:64px;height:64px}.s32{width:32px;height:32px}.s16{width:16px;height:16px}.brief{margin-top:22px;padding:18px 20px;background:#181818;border-left:3px solid #888;color:#c7c7c7}.brief strong{color:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}.tile{min-height:280px}}
</style></head><body><main>
<header><h1>Profer / icon studies · round 2</h1><p>从“UI 物件”转向“品牌形体” · 流动丝带 vs 弧月入口 · 黑白灰</p></header>
<section class="grid">
<article class="card"><h2>01 / 流动丝带</h2><p class="desc">连续、柔软、带有内腔的单一形体。重点看它是否有自己的运动节奏，而不是像某个具体物件。</p><div class="stage"><div class="tile dark"><img src="concept-ribbon.svg" alt="流动丝带黑底预览"></div><div class="tile light"><img src="concept-ribbon.svg" alt="流动丝带白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-ribbon.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-ribbon.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-ribbon.svg" alt=""><span>16</span></div></div></article>
<article class="card"><h2>02 / 弧月形体</h2><p class="desc">单一厚实的开放形体。更克制、更安静，像一个正在打开的智能入口。</p><div class="stage"><div class="tile dark"><img src="concept-crescent.svg" alt="弧月形体黑底预览"></div><div class="tile light"><img src="concept-crescent.svg" alt="弧月形体白底预览"></div></div><div class="sizes"><div><img class="s64" src="concept-crescent.svg" alt=""><span>64</span></div><div><img class="s32" src="concept-crescent.svg" alt=""><span>32</span></div><div><img class="s16" src="concept-crescent.svg" alt=""><span>16</span></div></div></article>
</section><div class="brief"><strong>这一轮的判断标准：</strong>不再看“像不像某个工具”，而看轮廓是否足够独立、缩小后是否仍有气质，以及黑白灰是否能支撑长期品牌使用。</div>
</main></body></html>
