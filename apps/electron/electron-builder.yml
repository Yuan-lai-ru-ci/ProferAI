# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.profer.app
productName: Profer
copyright: Copyright © 2024-2026 Profer

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 43.2.0

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# 打包后钩子（修补 Windows exe 图标）
afterPack: scripts/after-pack.cjs

# ASAR 打包配置
# 启用 ASAR 归档，将 SDK native binary 解压到 app.asar.unpacked/ 避免路径问题
asar: true
asarUnpack:
  - "node_modules/@anthropic-ai/**"
  # Pi 运行闭包中的 WASM / native addon 必须解包，避免 packaged runtime 从 ASAR 加载失败。
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/@earendil-works/pi-tui/native/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # Claude 与 Pi runtime 都作为主进程 external。打包前 sync:runtime-deps 会将
  # 依赖闭包同步到 appDir 下的 node_modules，避免 Bun workspace hoist 后丢失。
  - node_modules/**/*
  # 排除仅构建期使用的大型依赖；保留 Pi/Claude runtime 及其 native addon。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/@earendil-works/*/examples/**"
  - "!node_modules/@earendil-works/*/docs/**"
  - "!node_modules/@earendil-works/**/*.map"
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"

# 通用额外资源
extraResources:
  # proma CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 固定版本的 Bun runtime。Agent 的 Bash 环境显式将此目录置于 PATH 首位，
  # 因而安装版不依赖用户自行安装 Bun 或 GUI 进程继承的系统 PATH。
  - from: resources/vendor/bun
    to: vendor/bun
    # prepare:bundled-bun 只保留当前目标平台的 bun / bun.exe，不能写死 Windows 文件名。
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.proma/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/profer-logos
    to: profer-logos
    filter:
      - "**/*"
  # 内置皮肤包（设置 → 外观设置 → 特殊风格；skin-service 打包路径 process.resourcesPath/skins）
  - from: resources/skins
    to: skins
    filter:
      - "**/*"
  # PPT Style Pack（风格注册表与固定视觉缩略图；运行时路径 process.resourcesPath/ppt-style-packs）
  - from: resources/ppt-style-packs
    to: ppt-style-packs
    filter:
      - "**/*"
  # 皮肤模板（skin-manager 新建/导入皮肤时复制，打包路径 process.resourcesPath/skin-template）
  - from: resources/skin-template
    to: skin-template
    filter:
      - "**/*"
  # 窗口图标（Windows 任务栏 / Linux 标题栏 / macOS Dock 使用）
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  # 版本更新日志（设置 → 软件更新 → 版本历史；changelog-service 读取 process.resourcesPath/CHANGELOG.json）
  - from: resources/CHANGELOG.json
    to: CHANGELOG.json

# ============================================
# macOS 本地构建（P1：仅 Apple Silicon）
# ============================================
# 当前仅支持在 Apple Silicon Mac 上执行无签名本地构建；发布签名、公证、
# Intel x64 和 GitHub macOS CI 会在真机验收后单独接入，不能由本配置暗示已支持。
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Bun 和 Profer CLI 均由当前 macOS runner 构建，并在将来启用签名时纳入签名范围。
  binaries:
    - resources/bin/profer
    - resources/vendor/bun/bun
  extendInfo:
    NSMicrophoneUsageDescription: "Profer 需要访问麦克风，用于将你的语音实时转写为文本。"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

# DMG 布局
# 保持简单的应用 + Applications 链接，避免本地无签名验证引入额外主题资源依赖。
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: icon.ico
  fileAssociations:
    - ext: profer-backup
      name: Profer Personal Backup
      icon: resources/icon.ico
    - ext: profer-share
      name: Profer Share Package
      icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  artifactName: Profer-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 注入 NSIS 自定义段：安装完成后刷新 Windows Shell 图标缓存。
  # 覆盖安装到同一路径时，避免任务栏/桌面快捷方式仍显示旧（electron 默认）图标。
  include: scripts/nsis-icon-refresh.nsh

# ============================================
# 发布配置
# Windows Release 仍只由本地 scripts/push-release.cjs 上传；macOS 当前仅支持本地 arm64 无签名验收，
# 不进入发布源。Linux 不构建不发布；release.yml 目前仍是 Windows 手动构建验证。
# ============================================
publish:
  provider: github
  owner: Yuan-lai-ru-ci
  repo: ProferAI
  releaseType: release
