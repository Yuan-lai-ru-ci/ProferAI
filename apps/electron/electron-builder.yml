# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.profer.app
productName: Profer
copyright: Copyright © 2024-2026 Profer

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 43.2.0

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# 打包后钩子（修补 Windows exe 图标）
afterPack: scripts/after-pack.cjs

# ASAR 打包配置
# 启用 ASAR 归档，将 SDK native binary 解压到 app.asar.unpacked/ 避免路径问题
asar: true
asarUnpack:
  - "node_modules/@anthropic-ai/**"
  # Pi 运行闭包中的 WASM / native addon 必须解包，避免 packaged runtime 从 ASAR 加载失败。
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/@earendil-works/pi-tui/native/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # Claude 与 Pi runtime 都作为主进程 external。打包前 sync:runtime-deps 会将
  # 依赖闭包同步到 appDir 下的 node_modules，避免 Bun workspace hoist 后丢失。
  - node_modules/**/*
  # 排除仅构建期使用的大型依赖；保留 Pi/Claude runtime 及其 native addon。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/@earendil-works/*/examples/**"
  - "!node_modules/@earendil-works/*/docs/**"
  - "!node_modules/@earendil-works/**/*.map"
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"

# 通用额外资源
extraResources:
  # proma CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.proma/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/profer-logos
    to: profer-logos
    filter:
      - "**/*"
  # 窗口图标（Windows 任务栏 / Linux 标题栏 / macOS Dock 使用）
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

# ============================================
# Windows 配置
# ============================================
win:
  icon: icon.ico
  fileAssociations:
    - ext: profer-backup
      name: Profer Personal Backup
      icon: resources/icon.ico
    - ext: profer-share
      name: Profer Share Package
      icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  artifactName: Profer-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 注入 NSIS 自定义段：安装完成后刷新 Windows Shell 图标缓存。
  # 覆盖安装到同一路径时，避免任务栏/桌面快捷方式仍显示旧（electron 默认）图标。
  include: scripts/nsis-icon-refresh.nsh

# ============================================
# 发布配置
# 仅发布 Windows；macOS/Linux 不构建不发布（无 mac 开发者/测试环境，2026-08-08 起）。
# Windows 由 push-release.cjs 或 CI release.yml 上传到 GitHub Release。
# ============================================
publish:
  provider: github
  owner: Yuan-lai-ru-ci
  repo: ProferAI
  releaseType: release
