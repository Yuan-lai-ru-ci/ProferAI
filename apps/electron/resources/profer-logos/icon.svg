<svg width="66" height="66" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
  <!--
    Profer 菜单栏托盘图标（macOS Template 图标）。

    图形取自主应用图标 resources/icon.svg 内部那个「P」形标记：
    圆角主体去掉右下缺口后剩下的 Γ 形，加上缺口里独立的竖条。
    单色 + 透明底，macOS 按 alpha 通道反色，因此明暗菜单栏都能正确显示。

    尺寸：66×66 = 22pt @3x；图形占 51px（约 77%），四周留 7.5px 安全边距。
    生成链：本文件 → scripts/generate-brand-logos.mjs → iconTemplate{,@2x,@3x}.png
  -->
  <g transform="translate(7.5 7.5) scale(0.51)">
    <!-- 主体：100×100 圆角方块（圆角 21.77）减去右下缺口（x≥51.23 且 y≥26.13） -->
    <path
      d="M21.77 0H78.23A21.77 21.77 0 0 1 100 21.77V26.13H51.23V100H21.77A21.77 21.77 0 0 1 0 78.23V21.77A21.77 21.77 0 0 1 21.77 0Z"
      fill="#ffffff" />
    <!-- 缺口内的独立竖条，与主图标里的灰色竖条位置一致 -->
    <rect x="72.86" y="46.3" width="27.14" height="53.7" fill="#ffffff" />
  </g>
</svg>
